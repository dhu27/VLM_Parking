[project]
name = "vlm-parking"
version = "0.1.0"
description = "Can VLMs read an LA parking sign? A small benchmark separating perception from reasoning."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "imagehash>=4.3.2",
    "mapbox-vector-tile>=2.1",
    "onnxruntime>=1.30.0",
    "pandas>=2.2",
    "pillow>=10.4",
    "pyarrow>=25.0.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rapidocr>=3.9.2",
    "requests>=2.32",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_parking"]
